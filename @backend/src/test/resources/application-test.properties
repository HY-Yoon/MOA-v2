spring.application.name=moa2-test

# ==========================
# In-memory DB for tests
# ==========================
spring.datasource.url=jdbc:h2:mem:moa2test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.sql.init.mode=never

# ==========================
# Keep tests isolated / fast
# ==========================
spring.task.scheduling.enabled=false

# Avoid Redis auto-config in tests (no external Redis)
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# ==========================
# JWT dummy secrets (must exist for JwtTokenProvider beans)
# ==========================
jwt.access.secret=0123456789abcdef0123456789abcdef
jwt.refresh.secret=abcdef0123456789abcdef0123456789
