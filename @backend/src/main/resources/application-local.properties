# ============================================
# Local Development Profile
# ============================================

# ============================================
# Security - CORS Configuration (Local)
# ============================================
security.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
security.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
security.cors.allowed-headers=*
security.cors.exposed-headers=Set-Cookie
security.cors.allow-credentials=true
security.cors.max-age=3600

# ============================================
# Security - Headers Configuration (Local)
# ============================================
# XSS Protection
security.headers.xss-protection.enabled=true

# Frame Options
security.headers.frame-options.enabled=true

# Content Type Options
security.headers.content-type-options.enabled=true

# HSTS
security.headers.hsts.enabled=false
security.headers.hsts.max-age=31536000
security.headers.hsts.include-subdomains=true
security.headers.hsts.preload=true

# ============================================
# Logging
# ============================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.moa2=DEBUG

# ============================================
# JPA (Local)
# ============================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# Security - Cookie Configuration (Local)
# ============================================
security.cookie.secure=true
security.cookie.same-site=None

# ============================================
# JWT Configuration (Local Development)
# ============================================
jwt.access.secret=your-local-access-secret-key-at-least-32-characters-long-for-hs256
jwt.refresh.secret=your-local-refresh-secret-key-at-least-32-characters-long-for-hs256
jwt.access.expiration=86400000
jwt.refresh.expiration=604800000

# ============================================
# Encryption (Local Development)
# ============================================
encryption.key=your-local-encryption-key-32-chars

# ============================================
# OAuth2 (Local Development)
# ============================================
google.client-id=your-google-client-id
google.client-secret=your-google-client-secret
naver.client-id=your-naver-client-id
naver.client-secret=your-naver-client-secret
kakao.client-id=your-kakao-client-id
kakao.client-secret=your-kakao-client-secret

# spring.task.scheduling.enabled=false  # 주의: 이 설정을 true로 하면 스케줄러(@Scheduled)가 비활성화됩니다

# ============================================
# Payment - Backend-only test (noRedirect=1)
# ============================================
app.payment.test-no-redirect=true
spring.docker.compose.enabled=false

# ============================================
# Kafka (Local Development)
# ============================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
