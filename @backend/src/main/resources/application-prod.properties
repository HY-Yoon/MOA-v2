# ============================================
# Production Profile
# ============================================

# ============================================
# Security - CORS Configuration (Production)
# ============================================
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://yourdomain.com}
security.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
security.cors.allowed-headers=*
security.cors.exposed-headers=Set-Cookie
security.cors.allow-credentials=true
security.cors.max-age=3600

# ============================================
# Security - Headers Configuration (Production)
# ============================================
# XSS Protection
security.headers.xss-protection.enabled=true

# Frame Options
security.headers.frame-options.enabled=true

# Content Type Options
security.headers.content-type-options.enabled=true

# HSTS
security.headers.hsts.enabled=true
security.headers.hsts.max-age=31536000
security.headers.hsts.include-subdomains=true
security.headers.hsts.preload=true

# ============================================
# Logging
# ============================================
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.jdbc.core=WARN
logging.level.org.springframework.security=WARN
logging.level.com.moa2=INFO
# ============================================
# JPA (Production)
# ============================================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# ============================================
# Security - Cookie Configuration (Production)
# ============================================
security.cookie.secure=true
security.cookie.same-site=None

