spring.application.name=moa2

# ============================================
# Database - Neon DB (Serverless PostgreSQL)
# ============================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/moa2}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=60000

# ============================================
# JPA
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.defer-datasource-initialization=true

# ============================================
# Logging
# ============================================
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:INFO}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_LEVEL_BINDER:INFO}
logging.level.org.springframework.jdbc.core=${LOG_LEVEL_JDBC:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}

# ============================================
# SQL Init
# ============================================
spring.sql.init.mode=never

# ============================================
# File Upload
# ============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2MB
file.upload-dir=uploads
file.max-size=10485760

# ============================================
# Server
# ============================================
server.port=${PORT:8081}
# Tomcat URL 인코딩 설정 (한글 등 특수문자 허용)
server.tomcat.relaxed-query-chars=|,{,},[,],^
server.tomcat.relaxed-path-chars=|,{,},[,],^

# ============================================
# Redis
# ============================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=3000
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# ============================================
# OAuth2 - Google
# ============================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${APP_URL:http://localhost:8081}/login/oauth2/code/google

# ============================================
# OAuth2 - Naver
# ============================================
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID:your-naver-client-id}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET:your-naver-client-secret}
spring.security.oauth2.client.registration.naver.redirect-uri=${APP_URL:http://localhost:8081}/login/oauth2/code/naver
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.scope=name,email,mobile,profile_image,gender,birthday,birthyear,age
spring.security.oauth2.client.registration.naver.client-name=Naver

spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# ============================================
# OAuth2 - Kakao
# ============================================
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:your-kakao-client-id}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:your-kakao-client-secret}
spring.security.oauth2.client.registration.kakao.redirect-uri=${APP_URL:http://localhost:8081}/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,profile_image,account_email

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# OAuth2 Connection Timeout
spring.security.oauth2.client.timeout.connect=5000
spring.security.oauth2.client.timeout.read=10000

# ============================================
# JWT - Access Token
# ============================================
jwt.access.secret=${JWT_ACCESS_SECRET:your-jwt-access-secret-key-at-least-32-characters-long}
jwt.access.expiration=${JWT_ACCESS_EXPIRATION:86400000}

# ============================================
# JWT - Refresh Token
# ============================================
jwt.refresh.secret=${JWT_REFRESH_SECRET:your-jwt-refresh-secret-key-at-least-32-characters-long}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ============================================
# Encryption
# ============================================
encryption.key=${ENCRYPTION_KEY:your-encryption-key-32-characters}

# ============================================
# Frontend URL
# ============================================
frontend.url=${FRONTEND_URL:http://localhost:5173}

# ============================================
# Security - CORS Configuration
# ============================================
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
security.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
security.cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
security.cors.exposed-headers=${CORS_EXPOSED_HEADERS:Set-Cookie}
security.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
security.cors.max-age=${CORS_MAX_AGE:3600}

# ============================================
# Security - Headers Configuration
# ============================================
security.headers.xss-protection.enabled=${SECURITY_XSS_PROTECTION_ENABLED:true}
security.headers.frame-options.enabled=${SECURITY_FRAME_OPTIONS_ENABLED:true}
security.headers.content-type-options.enabled=${SECURITY_CONTENT_TYPE_OPTIONS_ENABLED:true}
security.headers.hsts.enabled=${SECURITY_HSTS_ENABLED:false}
security.headers.hsts.max-age=${SECURITY_HSTS_MAX_AGE:31536000}
security.headers.hsts.include-subdomains=${SECURITY_HSTS_INCLUDE_SUBDOMAINS:true}
security.headers.hsts.preload=${SECURITY_HSTS_PRELOAD:true}

# ============================================
# Jackson - Date/Time Formatting (KST)
# ============================================
spring.jackson.time-zone=Asia/Seoul
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# ============================================
# JPA - Timezone (KST)
# ============================================
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# ============================================
# Toss Payments
# ============================================
toss.secret-key=${TOSS_SECRET_KEY:test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6}

# ============================================
# Payment URL Configuration (토스 success/fail 핸들러)
# ============================================
# 토스 리다이렉트 대상: 백엔드 GET /api/v1/payment/success, /fail
app.payment.success-url=${PAYMENT_SUCCESS_URL:http://localhost:8081/api/v1/payment/success}
app.payment.fail-url=${PAYMENT_FAIL_URL:http://localhost:8081/api/v1/payment/fail}
# 핸들러 처리 후 리다이렉트 대상: 프론트 완료/실패 페이지
app.payment.frontend-complete-url=${PAYMENT_FRONTEND_COMPLETE_URL:http://localhost:5173/payment/complete}
app.payment.frontend-fail-url=${PAYMENT_FRONTEND_FAIL_URL:http://localhost:5173/payment/fail}
# 백엔드만 테스트 시 noRedirect=1 로 302 대신 200 JSON 반환 (local에서 true 권장)
app.payment.test-no-redirect=${PAYMENT_TEST_NO_REDIRECT:false}

# ============================================
# Active Profile
# ============================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ============================================
# Security - Cookie Configuration (Cross-Site)
# ============================================
security.cookie.secure=${SECURITY_COOKIE_SECURE:true}
security.cookie.same-site=${SECURITY_COOKIE_SAME_SITE:None}

