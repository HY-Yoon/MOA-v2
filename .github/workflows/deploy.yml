name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - 'feature/user-update'
    paths:
      - '@backend/**'
      - '.github/workflows/deploy.yml'
      - 'terraform/packer/**'
      - 'terraform/**'
  pull_request:
    branches:
      - 'feature/user-update'
    paths:
      - '@backend/**'
      - '.github/workflows/deploy.yml'
      - 'terraform/packer/**'
      - 'terraform/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./@backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Rename JAR file
        run: mv build/libs/*SNAPSHOT.jar build/libs/app.jar

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: @backend/build/libs/app.jar
          if-no-files-found: error

  build-ami:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: artifacts

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Get Subnet ID from Terraform
        working-directory: terraform
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_redis_host: ${{ secrets.REDIS_HOST }}
          TF_VAR_redis_password: ${{ secrets.REDIS_PASSWORD }}
          TF_VAR_redis_port: ${{ secrets.REDIS_PORT }}
          TF_VAR_kafka_bootstrap_servers: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
          TF_VAR_kafka_ssl_truststore_cert: ${{ secrets.KAFKA_SSL_TRUSTSTORE_CERT }}
          TF_VAR_kafka_ssl_keystore_cert: ${{ secrets.KAFKA_SSL_KEYSTORE_CERT }}
          TF_VAR_kafka_ssl_keystore_key: ${{ secrets.KAFKA_SSL_KEYSTORE_KEY }}
          TF_VAR_jwt_access_secret: ${{ secrets.JWT_ACCESS_SECRET }}
          TF_VAR_jwt_refresh_secret: ${{ secrets.JWT_REFRESH_SECRET }}
          TF_VAR_encryption_key: ${{ secrets.ENCRYPTION_KEY }}
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TF_VAR_kakao_client_id: ${{ secrets.KAKAO_CLIENT_ID }}
          TF_VAR_kakao_client_secret: ${{ secrets.KAKAO_CLIENT_SECRET }}
          TF_VAR_naver_client_id: ${{ secrets.NAVER_CLIENT_ID }}
          TF_VAR_naver_client_secret: ${{ secrets.NAVER_CLIENT_SECRET }}
          TF_VAR_mail_username: ${{ secrets.MAIL_USERNAME }}
          TF_VAR_mail_password: ${{ secrets.MAIL_PASSWORD }}
          TF_VAR_cors_allowed_origins: ${{ secrets.CORS_ALLOWED_ORIGINS }}
        run: |
          terraform init
          terraform apply -auto-approve
          echo "SUBNET_ID=$(terraform output -raw public_subnet_a_id)" >> $GITHUB_ENV

      - name: Setup Packer
        uses: hashicorp/setup-packer@main

      - name: Packer Init
        working-directory: terraform/packer
        run: packer init .

      - name: Build AMI with Packer
        working-directory: terraform/packer
        run: |
          packer build \
            -var "app_artifact_path=../../artifacts/app.jar" \
            -var "subnet_id=${{ env.SUBNET_ID }}" \
            .